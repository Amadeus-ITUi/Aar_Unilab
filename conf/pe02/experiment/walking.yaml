# @package _global_
# Fixed-home walking preparation. Select with +experiment=walking.
# Reward weights, loose termination, command sampling and PPO use the migration baseline.
env:
  joint_reset_range: [0.0, 0.0]
  base_velocity_reset_range: [0.0, 0.0]
  foot_contact_geoms: [L_foot_Link_collision_sole_0, R_foot_Link_collision_sole_0]
  # Sole contact is exempt; every other robot body is penalized, including hips.
  penalized_bodies: [body_link, L_hip_Link, L_thigh_Link, L_calf_Link, R_hip_Link, R_thigh_Link, R_calf_link]
  termination_bodies: [body_link]
  consecutive_failure: false
  fail_to_terminal_time_s: 0.5
  failure_contact_force: 5.0
  failure_gravity_z: -0.1

gait:
  frequencies: [2.0, 2.0]
  offsets: [0.5, 0.5]
  durations: [0.5, 0.5]
  swing_height: [0.06, 0.06]

noise:
  enabled: false

domain_rand:
  enabled: false
  push_enabled: false
  delay_ms_range: [0.0, 0.0]
  default_joint_offset_range: [0.0, 0.0]

reward:
  scales:
    keep_balance: 1.0
    tracking_lin_vel: 1.0
    tracking_ang_vel: 0.5
    base_height: -50.0
    lin_vel_z: -20.0
    ang_vel_xy: -0.01
    torques: -0.0002
    dof_acc: -2.5e-7
    action_rate: -0.01
    dof_pos_limits: -2.0
    collision: -3.0
    action_smooth: -0.005
    orientation: -5.0
    feet_distance: -150.0
    feet_regulation: -0.08
    foot_landing_vel: -0.15
    tracking_contacts_shaped_force: -2.0
    tracking_contacts_shaped_vel: -2.0
  only_positive: false
  clip_total: 100.0
  clip_single: 5.0
  tracking_sigma: 0.15
  ang_tracking_sigma: 0.20
  soft_joint_limit: 0.95
  # null selects PE02 home height in place of PE01-specific 0.25 m.
  base_height_target: null
  min_feet_distance: 0.08
  about_landing_threshold: 0.05
  gait_kappa: 0.05
  gait_force_sigma: 5.0
  gait_vel_sigma: 0.20


algo:
  num_envs: 4096

training:
  mujoco_threads: 32
  log_root: logs/pe02_walking
  evaluation_joint_noise: 0.0
  evaluation_velocity_noise: 0.0

play:
  gait: [2.0, 0.5, 0.5, 0.06]
  delay_ms: 0.0
