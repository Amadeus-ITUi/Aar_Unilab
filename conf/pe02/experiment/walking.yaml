# @package _global_
# Clock-free walking from the existing home pose. Select with +experiment=walking.
observation: pe02_v3
env:
  frame_size: 24
  joint_reset_range: [0.0, 0.0]
  base_velocity_reset_range: [0.0, 0.0]
  foot_contact_geoms: [L_foot_Link_collision_sole_0, R_foot_Link_collision_sole_0]
  # Sole contact is exempt; every other robot body is penalized, including hips.
  penalized_bodies: [body_link, L_hip_Link, L_thigh_Link, L_calf_Link, R_hip_Link, R_thigh_Link, R_calf_link]
  termination_bodies: [body_link]
  consecutive_failure: false
  fail_to_terminal_time_s: 0.5
  failure_contact_force: 5.0
  failure_gravity_z: -0.1

# No phase, gait command, or prescribed foot trajectory in v3.
gait: null

commands:
  zero_probability: 0.2

noise:
  enabled: false

domain_rand:
  enabled: false
  push_enabled: false
  delay_ms_range: [0.0, 0.0]
  default_joint_offset_range: [0.0, 0.0]

reward:
  scales:
    keep_balance: 0.0
    tracking_lin_vel: 6
    tracking_ang_vel: 3
    base_height: -3.0
    lin_vel_z: -5.0
    ang_vel_xy: -0.05
    torques: -0.0002
    dof_acc: -2.5e-7
    action_rate: -0.01
    dof_pos_limits: -2.0
    collision: -3.0
    action_smooth: -0.005
    orientation: -5.0
    feet_distance: -150.0
    feet_regulation: 0.0
    foot_landing_vel: -0.15
    tracking_contacts_shaped_force: 0.0
    tracking_contacts_shaped_vel: 0.0
    # Actual sole/ground contact replaces prescribed stance timing.
    feet_slide: -1.0
    feet_air_time: 0.25
    feet_air_height: 0.25
    base_contact: -20.0
    severe_tilt: -20.0
  only_positive: false
  clip_total: 100.0
  clip_single: 5.0
  tracking_sigma: 0.15
  ang_tracking_sigma: 0.20
  soft_joint_limit: 0.95
  # Track home height; normalize the squared error by std in meters.
  base_height_target: null
  base_height_std: 0.03
  min_feet_distance: 0.08
  about_landing_threshold: 0.05
  gait_kappa: 0.05
  gait_force_sigma: 5.0
  gait_vel_sigma: 0.20
  contact_force_threshold: 1.0
  feet_air_time_cap_s: 0.25
  # Airborne sole clearance: zero at/below 1 cm, linear to full reward at 10 cm.
  feet_air_height_range: [0.01, 0.10]
  moving_lin_vel_threshold: 0.1
  moving_ang_vel_threshold: 0.1
  severe_tilt_deg: 60.0


algo:
  num_envs: 4096

training:
  experiment_name: walking
  mujoco_threads: 32
  log_root: logs/pe02_walking
  evaluation_joint_noise: 0.0
  evaluation_velocity_noise: 0.0
  evaluation_height_tolerance: 0.01

play:
  gait: null
  delay_ms: 0.0
