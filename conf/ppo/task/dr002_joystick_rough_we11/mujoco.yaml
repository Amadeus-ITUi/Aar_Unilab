# @package _global_
# WE11 rough keeps the complete flat WE11 policy/physics contract and adds
# procedural heightfield terrain, critic height scan, and terrain curriculum.
defaults:
  - /task/dr002_joystick_flat_we11/mujoco
  - _self_

training:
  task_name: DR002JoystickRoughWE11
  sim_backend: mujoco
  play_start_pose: upright

env:
  # Get-up training is deliberately limited to the flat task.
  reset_pose:
    mode: upright
  terrain_scan:
    enabled: true
    geom_name: floor
  terrain_curriculum:
    enabled: true
    use_path_length: true
    demote_requires_commanded_distance: true
    demote_commanded_distance_frac: 0.25
    # csv_force is off, so terrain curriculum unlocks purely on the command
    # curriculum.
    unlock_after_force_curriculum: false
    initial_level: null
    seed: 42
  termination_config:
    terrain_out_of_bounds: true
    terrain_distance_buffer: 3.0
