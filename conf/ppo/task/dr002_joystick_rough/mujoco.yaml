# @package _global_
training:
  task_name: DR002JoystickRough
  sim_backend: mujoco
  play_steps: 500
  play_env_num: 1
  render_spacing: 0.0
  cam_tracking: true
  cam_tracking_env_idx: 0

interactive:
  action_mode: policy
  policy_obs_mode: actor
  camera_follow_body: true
  use_env_visual_model: false

algo:
  num_envs: 4096
  num_steps_per_env: 24
  max_iterations: 30000
  save_interval: 100
  empirical_normalization: false
  obs_groups:
    actor:
      - actor
    critic:
      - critic
  actor:
    class_name: unilab.algos.torch.dr002_mlp_adapt:MlpAdaptModel
    activation: elu
    obs_normalization: false
    distribution_cfg:
      class_name: rsl_rl.modules.distribution.GaussianDistribution
      init_std: 0.5
      std_type: scalar
    max_length: 5
    cmd_dim: 3
    latent_dim: 3
    privileged_target_key: privileged_target
    privileged_target_dim: 3
    history_term_dims: [3, 3, 4, 6, 6, 3]
    mlp_hidden_dims: [128, 64]
    actor_hidden_dims: [128, 64, 32]
  critic:
    class_name: rsl_rl.models.MLPModel
    hidden_dims: [256, 128, 64]
    activation: elu
    obs_normalization: false
  algorithm:
    learning_rate: 1.0e-3
    entropy_coef: 1.0e-2
    desired_kl: 0.005
    adaptation_loss_coef: 1.0

env:
  max_episode_seconds: 23.0
  sim_dt: 0.0025
  ctrl_dt: 0.02
  control_config:
    action_scale: 0.5
    wheel_action_scale: 10.0
    clip_actions: 100.0
    wheel_clip_actions: 2.5
    simulate_action_latency: true
    action_delay_min_steps: 4
    action_delay_max_steps: 8
    resample_action_delay: true
    Kp: [2.0, 8.0, 0.0, 2.0, 8.0, 0.0]
    Kd: [0.1, 0.8, 0.05, 0.1, 0.8, 0.05]
  commands:
    lin_vel_x: [-0.5, 0.5]
    ang_vel_z: [-1.0, 1.0]
    height: [0.28, 0.28]
    resampling_time: 5.0
    startup_stand_seconds: 3.0
    rel_standing_envs: 0.0
    curriculum: true
    range_multiplier: [1.0, 2.0]
    ang_vel_z_range_multiplier: [0.3, 1.0]
    curriculum_threshold: 0.7
    curriculum_step: 0.1
  scene:
    model_file: src/unilab/assets/robots/dr002/dr002_latest.xml
    fragment_files: []
    terrain:
      hfield_name: terrain_hfield
      geom_name: floor
      generator:
        seed: 42
        curriculum: true
        size: [8.0, 8.0]
        num_rows: 10
        num_cols: 20
        border_width: 20.0
        horizontal_scale: 0.1
        vertical_scale: 0.005
  terrain_scan:
    enabled: true
    geom_name: floor
  terrain_curriculum:
    enabled: true
  termination_config:
    terrain_out_of_bounds: true
    terrain_distance_buffer: 3.0
  domain_rand:
    randomize_init_yaw: true
    randomize_base_mass: true
    added_mass_range: [-0.2, 0.2]
    randomize_body_mass: true
    body_mass_multiplier_range: [0.9, 1.2]
    random_com: true
    com_offset_x: [-0.01, 0.01]
    com_offset_y: [-0.01, 0.01]
    com_offset_z: [-0.01, 0.01]
    randomize_ground_friction: true
    ground_friction_multiplier_range: [0.5, 2.0]
    randomize_dof_armature: false
    randomize_kp: true
    kp_multiplier_range: [0.8, 1.2]
    randomize_kd: true
    kd_multiplier_range: [0.8, 1.2]
    randomize_torque_scale: true
    torque_scale_range: [0.8, 1.2]
    randomize_default_joint_pos: true
    default_joint_pos_offset_range: [-0.02, 0.02]
    push_robots: true
    push_interval: 350
    push_velocity_x_range: [-1.0, 1.0]
    push_velocity_y_range: [-1.0, 1.0]
    max_force: [1.0, 1.0, 0.5]
    csv_force_enabled: true
    csv_force_path: /home/esd_wch/lsaac_lab_ws/force_curriculum_csv/1hz.csv
    csv_force_curriculum_paths:
      - /home/esd_wch/lsaac_lab_ws/force_curriculum_csv/1hz.csv
      - /home/esd_wch/lsaac_lab_ws/force_curriculum_csv/1hz.csv
      - /home/esd_wch/lsaac_lab_ws/force_curriculum_csv/2hz.csv
      - /home/esd_wch/lsaac_lab_ws/force_curriculum_csv/2hz.csv
      - /home/esd_wch/lsaac_lab_ws/force_curriculum_csv/3hz.csv
      - /home/esd_wch/lsaac_lab_ws/force_curriculum_csv/3hz.csv
      - /home/esd_wch/lsaac_lab_ws/force_curriculum_csv/5hz.csv
      - /home/esd_wch/lsaac_lab_ws/force_curriculum_csv/5hz.csv
      - /home/esd_wch/lsaac_lab_ws/force_curriculum_csv/6hz.csv
      - /home/esd_wch/lsaac_lab_ws/force_curriculum_csv/6hz.csv
    # Wing vibration frequency labels, not CSV sampling rates.
    csv_force_curriculum_hz: [1, 1, 2, 2, 3, 3, 5, 5, 6, 6]
    csv_force_period: 10.0
    csv_force_push_point: [0.006, 0.0, 0.066]
    csv_force_apply_point_torque: true
    csv_force_curriculum: true
    # Curriculum progress only selects the CSV level; raw CSV force is not amplitude-scaled.
    csv_force_scale_initial: 0.1
    csv_force_scale_final: 1.0
    csv_force_scale_step: 0.1
    push_body_name: base_link
  noise_config:
    level: 1.5

reward:
  scales:
    alive: 1.0
    track_lin_vel_x: 1.0
    track_ang_vel_z: 1.0
    track_lin_vel_x_enhance: 1.0
    lin_vel_z: -2.0
    ang_vel_xy: -0.05
    orientation: -10.0
    base_height: -1.0
    joint_torques_l2: -1.0e-4
    joint_torques_wheel_l2: -1.0e-4
    joint_vel_l2: -5.0e-5
    joint_acc_l2: -2.5e-7
    joint_acc_wheel_l2: -2.5e-7
    joint_pos_limits: -1.0
    nominal_state_lingzu: -0.6
    action_rate_l2: -0.01
    action_smooth_lingzu: -0.03
    undesired_contacts: -20.0
  tracking_sigma: 0.25
  base_height_std: 0.05
  base_height_clip: 4.0
  only_positive_rewards: false
  undesired_contact_threshold: 0.1
  termination_contact_threshold: 5.0
  termination_gravity_z_threshold: 0.7
  termination_fail_time_s: 0.001
