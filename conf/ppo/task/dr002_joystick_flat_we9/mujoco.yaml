# @package _global_
# U9/WE9 owner: converged command-delay PACE dynamics and 200 Hz motor ZOH.
defaults:
  - /task/dr002_joystick_flat_we6/base
  - _self_

training:
  task_name: DR002JoystickFlatWE9
  sim_backend: mujoco

algo:
  algorithm:
    entropy_coef: 5.0e-3
    desired_kl: 1.2e-2
    # Deadband: grow below 0.008, hold through [0.008, 0.018], decay above 0.018.
    adaptive_kl_threshold_factor: 1.5
    adaptive_lr_decay_factor: 1.1
    adaptive_lr_growth_factor: 1.2
    # Hold LR fixed through all 5 x 4 PPO updates, then adjust it once from mean KL.
    adaptive_lr_update_mode: iteration

reward:
  scales:
    # Disable the WE6 survival bonus for WE9.
    alive: 0.0
    track_lin_vel_x: 1.5
    track_lin_vel_x_enhance: 1.5
    joint_acc_wheel_l2: -2.5e-7
    nominal_state_lingzu: -1.0
  # Keep yaw tracking on the inherited 0.25 width, while matching the
  # established WE9 forward-velocity exponential denominators.
  track_lin_vel_x_std: 0.5
  track_lin_vel_x_enhance_std: 1.5811388300841898
  # Do not let the historical +/-1/s per-term guard erase the 1.5 weights.
  track_lin_vel_x_term_clip: 1.5
  # Restore the original DR002 contact-failure contract: contact must exceed
  # 5.0 for the inherited 25 consecutive control steps (0.5 s) to terminate.
  termination_contact_threshold: 5.0

env:
  # 400 Hz physics, 50 Hz policy, and a 200 Hz non-native motor controller.
  sim_dt: 0.0025
  ctrl_dt: 0.02
  commands:
    # Once the velocity-command curriculum advances, WE9 never demotes it.
    curriculum_allow_demotion: false
  wing_angle_obs:
    # Keep the motor-position replay paired with the eligible 1-3 Hz wrench
    # sources. Level 0 remains the reset-sampled bounded standing observation.
    curriculum_paths:
      - robots/dr002/wing_angle_obs/sweep_20260713_230639/1hz.csv
      - robots/dr002/wing_angle_obs/sweep_20260713_230639/2hz.csv
      - robots/dr002/wing_angle_obs/sweep_20260713_230639/3hz.csv
    # Independent from the physical CSV wrench scale: sample one multiplier per
    # environment at reset and apply it only to the 1-3 Hz motor-position obs.
    csv_amplitude_scale_range: [0.8, 1.2]
    # Replace the inherited +/-0.1 deg uniform noise with per-frame,
    # per-motor 5% multiplicative Gaussian observation noise.
    noise_half_range_deg: 0.0
    gaussian_noise_relative_std: 0.05
  control_config:
    # The wheel Kd is 0.05 instead of WE6's 0.20. A 4x larger action scale
    # preserves Kd * scale = 0.5 Nm/action; the reciprocal clip preserves the
    # same maximum wheel target speed of +/-25 rad/s.
    wheel_action_scale: 10.0
    wheel_clip_actions: 2.5
    simulate_action_latency: true
    action_delay_semantics: pre_controller_command_fifo
    torque_delay_steps: 0
    motor_control_hz: 200.0
    # Draw one FIFO depth per environment and share it across all six joints.
    # Motor ticks are 5 ms, so sample the inclusive 10-40 ms range.
    action_delay_steps_by_joint: null
    action_delay_min_steps: 2
    action_delay_max_steps: 8
    resample_action_delay: true
    # The Python motor owner recomputes PD every second physics step and
    # zero-order-holds its clipped torque in between.
    use_native_batched_pd: false
    Kp: [4.11, 3.91, 0.0, 4.11, 3.91, 0.0]
    Kd: [0.160, 0.193, 0.05, 0.160, 0.193, 0.05]
  domain_rand:
    randomize_base_mass: true
    # Added kilograms, relative to the identified nominal U9 base mass.
    added_mass_range: [0.0, 0.5]
    # Scale all three base principal inertias by (m0 + delta) / m0.
    # This assumption leaves COM unchanged; the inherited independent COM
    # randomization remains available for payload-location uncertainty.
    couple_base_inertia_to_added_mass: true
    # Match Walking_Eagle-Train commit e1cd345b's startup event: every
    # positive-mass non-base body gets its own U[0.9, 1.2] scale and its
    # principal inertia is recomputed with the same scale. The draw is fixed
    # for the lifetime of each environment instead of changing every episode.
    randomize_body_mass: true
    body_mass_multiplier_range: [0.9, 1.2]
    body_mass_share_bilateral_scale: false
    body_mass_resample_on_reset: false
    # At 50 Hz, independently sample one body-frame planar force event inside
    # every 5-second window. Do not add a base-velocity jump.
    push_interval: 250
    push_randomize_within_interval: true
    push_linear_velocity_delta_limit: null
    push_force_limit: [10.0, 10.0, 0.0]
    # The six-axis sensor origin coincides with U9's push_site. Rotate its raw
    # Mx/My/Mz with the same site-to-base matrix as force, then add the
    # inherited (push_site - randomized COM) x force transport moment.
    csv_force_apply_measured_moment: true
    # WE9 excludes the unstable 4 Hz source. Reset sampling and curriculum
    # promotion can therefore select only the discrete 0/1/2/3 Hz levels.
    csv_force_path: robots/dr002/measured_wrench/sweep_20260728_u9_skin/1hz.csv
    csv_force_curriculum_paths:
      - robots/dr002/measured_wrench/sweep_20260728_u9_skin/1hz.csv
      - robots/dr002/measured_wrench/sweep_20260728_u9_skin/2hz.csv
      - robots/dr002/measured_wrench/sweep_20260728_u9_skin/3hz.csv
    csv_force_curriculum_hz: [0, 1, 2, 3]
    csv_force_curriculum_promote_tracking_threshold: 0.70
    csv_force_curriculum_promote_fail_rate_max: 0.30
    # The persistent 20% standing set keeps command [0, 0, 0.24] but samples
    # the same paired force/wing replay levels and start delays as other envs.
    csv_force_apply_to_standing: true
    # Sample one shared multiplier per environment at every reset and hold it
    # for the episode. It scales all CSV Fx/Fy/Fz/Mx/My/Mz channels together,
    # so only the 1-3 Hz measured wrench amplitude changes.
    csv_force_amplitude_scale_range: [0.5, 1.5]
    # Critic-only observation uses the rotated measured sensor moment itself,
    # without the r x F transport term. Actor/history remain unchanged.
    csv_force_observation_include_measured_moment: true
    csv_force_observation_moment_normalization: 15.0
