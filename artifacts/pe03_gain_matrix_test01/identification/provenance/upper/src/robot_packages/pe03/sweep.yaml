format_version: 1
robot_id: pe03

defaults:
  publish_rate_hz: 200.0
  record_rate_hz: 200.0
  state_timeout_sec: 10.0
  return_speed_rad_s: 0.10
  return_min_duration_sec: 1.0
  settle_duration_sec: 0.25
  hold_kp: 100.0
  hold_kd: 5.0

poses:
  hip_limit_center:
    R_hip_: limit_midpoint
    R_thigh_: robot_default
    R_calf_: robot_default
    L_hip_: limit_midpoint
    L_thigh_: robot_default
    L_calf_: robot_default

  thigh_limit_center:
    R_hip_: robot_default
    R_thigh_: limit_midpoint
    R_calf_: robot_default
    L_hip_: robot_default
    L_thigh_: limit_midpoint
    L_calf_: robot_default

  calf_limit_center:
    R_hip_: robot_default
    # Calf 台架特例：两侧 thigh 顶到 0 rad 端点并以 hold 增益固定。
    R_thigh_: 0.0
    R_calf_: limit_midpoint
    L_hip_: robot_default
    L_thigh_: 0.0
    L_calf_: limit_midpoint

groups:
  hip:
    enabled: true
    mode: position
    start_frequency_hz: 0.1
    end_frequency_hz: 5.0
    duration_sec: 40.0
    kp: 4.3
    kd: 0.34
    preparation_pose: hip_limit_center
    targets:
      - {joint_name: L_hip_, phase_sign: 1.0, limit_margin_rad: 0.5}
      - {joint_name: R_hip_, phase_sign: -1.0, limit_margin_rad: 0.5}

  thigh:
    enabled: true
    mode: position
    start_frequency_hz: 0.1
    end_frequency_hz: 5.0
    duration_sec: 40.0
    kp: 4.3
    kd: 0.34
    preparation_pose: thigh_limit_center
    targets:
      - {joint_name: L_thigh_, phase_sign: -1.0, limit_margin_rad: 0.5}
      - {joint_name: R_thigh_, phase_sign: 1.0, limit_margin_rad: 0.5}

  calf:
    enabled: true
    mode: position
    start_frequency_hz: 0.1
    end_frequency_hz: 5.0
    duration_sec: 40.0
    kp: 4.9
    kd: 0.24
    preparation_pose: calf_limit_center
    targets:
      - {joint_name: L_calf_, phase_sign: -1.0, limit_margin_rad: 0.6}
      - {joint_name: R_calf_, phase_sign: 1.0, limit_margin_rad: 0.6}
