imu_node:
  ros__parameters:
    serial_port: "/dev/ttyUSB0"
    baud_rate: 115200
    frame_id: "imu_link"
    imu_topic: "/IMU_data"
    publish_rate: 200
    
    # Debug mode settings
    debug_mode: true
    enable_plotting: true  # 启用数据记录和绘图
    imu_ang_vel_lpf_alpha: 0.4
    imu_gravity_lpf_alpha: 0.4
    output_file: ""  # 留空则自动生成时间戳文件名
