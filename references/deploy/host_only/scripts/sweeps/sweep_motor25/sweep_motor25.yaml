# Guided direct-CAN motor 2/5 sweep.
# Motors 7/8 are never accessed. Motors 1/3/4/6 hold the sweep pose.

swept_motor_ids: [2, 5]
hold_motor_ids: [1, 3, 4, 6]
motor_ids: [1, 2, 3, 4, 5, 6]

# Preserve the original physical sweep pose and add the changed zero-reference
# offset explicitly.
sweep_base_def_pos_policy_rad: [-0.42, 0.50, 0.0, -0.42, 0.50, 0.0]
# [-0.92020, 0.98338] - [-0.82, 1.07] = [-0.10020, -0.08662].
zero_reference_offset_policy_rad: [-0.10020, -0.08662, 0.0, -0.10020, -0.08662, 0.0]
# Final policy target: [-0.52020, 0.41338, 0, -0.52020, 0.41338, 0].
# Final raw target:    [+0.52020, 0.41338, 0, -0.52020, -0.41338, 0].
flipped_motors: [true, false, true, false, true, false]

can:
  channel: can0
  master_id: 0
  initial_status_timeout_sec: 1.0
  require_initial_feedback: true
  enable_motors: true
  enable_retries: 5
  disable_on_exit: true

joy:
  # Xbox A (/joy.buttons[0]) is used for all three gates.
  confirm_button: 0
  timeout_sec: 120.0

return_to_def_pos:
  kp: 1.0
  kd: 0.1
  speed_rad_s: 0.10
  min_duration_sec: 1.0

hold:
  # Order follows hold_motor_ids: [motor1, motor3, motor4, motor6].
  kp: [40.0, 40.0, 40.0, 40.0]
  kd: [2, 2, 2, 2]

sweep:
  control_mode: position
  # Policy directions are equal. After flipped conversion:
  # raw motor2=+sin and raw motor5=-sin for the mirrored installation.
  signs: [1.0, 1.0]
  publish_rate_hz: 200.0
  record_rate_hz: 200.0
  start_frequency_hz: 0.1
  end_frequency_hz: 5.0
  amplitude_rad: 0.25
  duration_sec: 40.0
  kp: 8.0
  kd: 0.8
  torque_nm: 0.0
  restore_gains_on_exit: true
  output_file: logs/sweep_motor25_{timestamp}.csv
