[build-system]
requires = ["setuptools>=69,<70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "unilab"
version = "0.1.0"
description = "WE11 RSL-RL PPO training and MuJoCo simulation archive"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10,<3.14"
dependencies = [
    "numpy>=1.26,<3",
    "torch==2.7.0",
    "mujoco-uni==3.8.0",
    "gymnasium",
    "imageio",
    "hydra-core>=1.3",
    "tensordict",
    "rsl-rl-lib>=5.0.0",
    "mediapy",
    "tensorboard",
    "setuptools<70",
    "typing-extensions",
    "wandb",
    "onnxruntime<1.20 ; python_version < '3.11'",
    "onnxruntime==1.22.0 ; python_version >= '3.11'",
    "onnx==1.18.0",
    "ninja ; sys_platform == 'linux'",
    "cmaes>=0.11,<1",
    "matplotlib>=3.8,<4",
    "scipy>=1.11,<2",
]

[project.scripts]
train = "unilab.cli:train_main"
eval = "unilab.cli:eval_main"
unilab-complete = "unilab.tools.completion:main"
unilab-viz-nan = "unilab.tools.viz_nan:main"
unilab-export-scene = "unilab.tools.export_scene:main"

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff", "mypy"]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["unilab*"]

[tool.setuptools.package-data]
unilab = [
    "assets/**/*.STL",
    "assets/**/*.csv",
    "assets/**/*.json",
    "assets/**/*.md",
    "assets/**/*.urdf",
    "assets/**/*.xml",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src"]
extend-exclude = [".history", "references"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = [
    "E501",
    "N806",
    "E402",
    "F401",
    "N801",
    "F821",
    "E741",
    "N802",
    "N803",
    "N812",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
no_site_packages = true
exclude = [
    "src/unilab/algos/torch/rsl_rl/", # vendored third-party, tracked in .gitignore
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long-running training or script smoke tests, or cumulatively expensive backend matrices",
]
addopts = "--tb=short -m 'not slow'"

[tool.coverage.run]
source = ["src/unilab"]
omit = ["*/rsl_rl/*"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]
